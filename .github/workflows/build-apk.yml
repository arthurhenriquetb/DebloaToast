name: Build DebloaToast Expert v0.12
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: a01-optimizer-v08-debug-key-v1
      - name: Ensure signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Compile Expert APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare public APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk DebloaToast-Expert-v0.12.apk
      - name: Upload current build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebloaToast-Expert-v0.12-APK
          path: DebloaToast-Expert-v0.12.apk
          if-no-files-found: error
      - name: Publish single stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="DebloaToast-Expert-v0.12.apk"
          COMPANION="desktop/DebloaToast-Windows.zip#DebloaToast-Windows.zip"
          if gh release view v0.12 >/dev/null 2>&1; then
            gh release upload v0.12 "$APK" "$COMPANION" --clobber
            gh release edit v0.12 --title "DebloaToast Expert v0.12" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create v0.12 "$APK" "$COMPANION" --title "DebloaToast Expert v0.12" --notes-file RELEASE_NOTES.md --latest
          fi
      - name: Keep only the Expert public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.12 >/dev/null 2>&1; then
            gh release delete v0.11 --yes --cleanup-tag 2>/dev/null || true
          else
            echo "v0.12 was not published; retaining prior release." >&2
            exit 1
          fi
      - name: Update repository About description if permitted
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f description='DebloaToast Expert v0.12 — Android 10+ debloater with guided ADB setup and critical system-app removal. Extreme risk; use at your own risk. Developer: Arthur Henrique Tostes Batista Aranha.' -f homepage='https://github.com/arthurhenriquetb/DebloaToast/releases/latest'; then
            echo "Repository About description updated."
          else
            echo "GitHub Actions token cannot edit repository About settings. README and release notes were updated."
          fi
      - name: Remove obsolete build artifacts and runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, (.workflow_run.id // 0)] | @tsv' |
          while IFS="$(printf '\t')" read -r id run_id; do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null 2>&1 || true
            fi
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[].id' |
          while read -r run_id; do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null 2>&1 || true
            fi
          done
